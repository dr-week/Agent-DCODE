[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dcode"
version = "2.0.0"
description = "Autonomous SWE & Deep-Research Agent Platform with Modular Open-Source Integrations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
integrations = [
    "litellm>=1.40.0",
    "fastmcp>=0.4.0",
    "tree-sitter>=0.21.0",
    "crawl4ai>=0.4.0",
    "browser-use>=0.1.0",
    "mem0ai>=0.1.0",
    "langfuse>=2.40.0",
    "qiskit>=1.0.0",
]

[project.scripts]
dcode = "scripts.dcode_cli:main"
dcode-orch = "scripts.dcode_orchestrator:main"
dcode-web = "dcode.web.app:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
