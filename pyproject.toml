[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dcode"
version = "1.3.0"
description = "Local-First Autonomous AI Coding Agent with CLI-Anything Integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.scripts]
dcode = "scripts.dcode_cli:main"
dcode-orch = "scripts.dcode_orchestrator:main"
dcode-web = "dcode.web.app:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
