name: Agent-DCODE Modularity & Eval CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce Strict < 100 Lines Per File Modularity Gate
        run: |
          python3 scripts/check_modularity.py

      - name: Run Static Analysis & Linter Gate
        run: |
          python3 scripts/lint.py

      - name: Run Framework, Integrations, Harness, and CLI-Anything Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Quantitative SWE Evaluation Suite
        run: |
          python3 evals/run_evals.py
